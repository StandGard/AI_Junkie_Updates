# Starter set of companies, models, tools, and benchmark definitions for the
# entities the platform tracks. This is a STARTING POINT — model rosters, prices,
# and benchmark SCORES are kept current automatically by the live ingestion
# sources (Phase 3). Edit freely; `KnowledgeBase.seed_from_yaml()` upserts these
