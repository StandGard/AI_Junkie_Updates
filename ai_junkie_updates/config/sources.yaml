api_feed:
  # Crunchbase — requires API key
  - name: Crunchbase AI Companies
    url: https://api.crunchbase.com/api/v4/searches/funding_rounds
    api_key: "${CRUNCHBASE_API_KEY}"
    content_path: "entities"
    params:
      field_ids: '["funded_organization_identifier","money_raised","announced_on"]'
      query: '["artificial intelligence"]'
    pagination:
      page_param: "after_id"
  # PitchBook — requires API key
  - name: PitchBook AI Feed
    url: https://api.pitchbook.com/v1/companies
    api_key: "${PITCHBOOK_API_KEY}"
    content_path: "items"
    params:
      keywords: "artificial intelligence"
    pagination:
      page_param: "page"
  # NewsAPI — requires API key
  - name: NewsAPI AI
    url: https://newsapi.org/v2/everything
    api_key: "${NEWSAPI_API_KEY}"
    content_path: "articles"
    params:
      q: "artificial intelligence"
      language: "en"
      sortBy: "publishedAt"
      pageSize: 20
    pagination:
      page_param: "page"
