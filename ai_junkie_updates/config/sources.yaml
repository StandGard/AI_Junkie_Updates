    url: https://platform.openai.com/docs/changelog
  - name: Anthropic Changelog
    url: https://docs.anthropic.com/en/docs/about-claude/changelog
  - name: HuggingFace Changelog
    url: https://github.com/huggingface/transformers/releases
  - name: LangChain Changelog
    url: https://github.com/langchain-ai/langchain/releases
