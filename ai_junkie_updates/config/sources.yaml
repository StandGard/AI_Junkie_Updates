    url: https://github.com/ollama/ollama/releases
  - name: vLLM Releases
    url: https://github.com/vllm-project/vllm/releases

github:
  # STRONGLY RECOMMENDED: provide a GitHub token. Unauthenticated requests are
  # capped at 60/hour per IP, but this agent polls every repo each cycle
  # (10 repos every 5 min = ~120/hour), so without a token it will perpetually
  # hit HTTP 403 "rate limit exceeded" and collect nothing. A token raises the
  # limit to 5,000/hour. Uncomment the line below and set GITHUB_TOKEN in the
  # environment (load_sources expands ${...} placeholders).
  # - token: "${GITHUB_TOKEN}"
  - repo: huggingface/transformers
  - repo: openai/openai-python
  - repo: anthropics/anthropic-sdk-python
  - repo: langchain-ai/langchain
  - repo: run-llama/llama_index
  - repo: ollama/ollama
  - repo: vllm-project/vllm
  - repo: microsoft/autogen
  - repo: BerriAI/litellm
  - repo: ggerganov/llama.cpp

reddit:
  - subreddit: MachineLearning
  - subreddit: LocalLLaMA
  - subreddit: artificial
  - subreddit: OpenAI
  - subreddit: ClaudeAI
  - subreddit: StableDiffusion
  - subreddit: singularity

discord:
  # Discord agent uses a webhook receiver. Configure your Discord bot to POST
  # messages to http://localhost:8484/discord/webhook with the following JSON:
  # {
  #   "server_name": "...",
  #   "channel_name": "...",
  #   "author": "...",
  #   "content": "...",
  #   "message_id": "...",
  #   "message_url": "..."
  # }
  - webhook_port: 8484
    servers:
      - name: "OpenAI Discord"
        note: "Configure your Discord bot to forward #announcements"
      - name: "HuggingFace Discord"
        note: "Configure your Discord bot to forward #releases"
      - name: "LangChain Discord"
        note: "Configure your Discord bot to forward #announcements"

onchain:
  - name: Bittensor
    api_url: https://api.taostats.io/api/v1/subnet/events
    explorer_url: https://taostats.io
    params:
      limit: 20
  - name: Fetch.ai
    api_url: https://explore-fetchhub.fetch.ai/api/v1/events
    explorer_url: https://explore-fetchhub.fetch.ai
    params:
      limit: 20
  - name: Ocean Protocol
    api_url: https://v4.aquarius.oceanprotocol.com/api/aquarius/assets/ddo
    explorer_url: https://market.oceanprotocol.com
    params:
      limit: 20
  - name: Render Network
    api_url: https://api.render.com/events
    explorer_url: https://renderscan.io
    params:
      limit: 20

telegram_channels:
  # Add your monitored Telegram channels here.
  # Method "rss" uses an RSS bridge; "bot_api" uses the Telegram Bot API.
  #
  # Example:
