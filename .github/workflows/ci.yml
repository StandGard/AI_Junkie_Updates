name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps (lxml/cffi build)
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libxslt1-dev libffi-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # feedparser's sgmllib3k dep fails to build on 3.11; install without deps.
          pip install --no-deps feedparser
          pip install -r ai_junkie_updates/requirements.txt

      - name: Run test suite
        env:
          AIJU_ANTHROPIC_API_KEY: test-key
          AIJU_TELEGRAM_BOT_TOKEN: test-token
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile all modules (syntax gate)
        run: python -m compileall -q ai_junkie_updates
