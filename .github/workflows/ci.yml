name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  offline-tests:
    name: Offline tests (no network, no keys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (with build workarounds)
        run: |
          python -m pip install --ignore-installed -r ai_junkie_updates/requirements.txt
          # feedparser needs the stdlib-style 'sgmllib' module (see CLAUDE.md).
          if ! python -c "import sgmllib" >/dev/null 2>&1; then
            SP="$(python -c 'import site; print(site.getsitepackages()[0])')"
            TMP="$(mktemp -d)"
            pip download sgmllib3k --no-binary :all: --no-deps -d "$TMP"
            tar xzf "$TMP"/sgmllib3k-*.tar.gz -C "$TMP"
            cp "$TMP"/sgmllib3k-*/sgmllib.py "$SP/sgmllib.py"
            rm -rf "$TMP"
          fi
          # python-telegram-bot -> cryptography needs a working cffi backend.
          python -c "import _cffi_backend" >/dev/null 2>&1 || pip install --ignore-installed cffi cryptography

      - name: Verify imports
        run: python -c "import ai_junkie_updates.main; print('imports OK')"

      - name: Pipeline test
        run: python tests/test_pipeline_offline.py

      - name: Agent collect() tests
        run: python tests/test_agents_offline.py

      - name: Preflight tests
        run: python tests/test_preflight_offline.py

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ai-junkie-updates:ci
