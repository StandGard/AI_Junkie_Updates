name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          # feedparser's sgmllib3k dep fails to build on 3.11; install
          # feedparser without deps and vendor sgmllib.py (see CLAUDE.md).
          grep -v '^feedparser' ai_junkie_updates/requirements.txt > /tmp/reqs.core.txt
          pip install -r /tmp/reqs.core.txt
          pip install --no-deps "feedparser>=6.0.11,<7.0.0"
          SP=$(python -c "import site; print(site.getsitepackages()[0])")
          pip download --no-deps --no-build-isolation sgmllib3k -d /tmp/sgml
          tar -xzf /tmp/sgml/sgmllib3k-*.tar.gz -C /tmp/sgml
          cp /tmp/sgml/sgmllib3k-*/sgmllib.py "$SP/sgmllib.py"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy

      - name: Tests (pytest)
        run: pytest
