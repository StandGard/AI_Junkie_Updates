# AI Junkie Updates — single-service deployment.
# Usage:
#   cp ai_junkie_updates/.env.example .env   # fill in your keys
#   docker compose up -d --build
services:
  aijunkie:
    build: .
    image: ai-junkie-updates:latest
    container_name: ai-junkie-updates
    restart: unless-stopped
    # Load AIJU_* secrets/config from a .env file at the repo root.
    env_file:
      - .env
    ports:
      # Health/readiness endpoints (and the Discord webhook receiver on 8484).
      - "8585:8585"
      - "8484:8484"
    volumes:
      # Persist the SQLite DB and let config be edited without rebuilding.
      - ./storage:/app/storage
      - ./ai_junkie_updates/config:/app/ai_junkie_updates/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8585/health',timeout=5).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
